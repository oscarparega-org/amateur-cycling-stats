services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-acs_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
