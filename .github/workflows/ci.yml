name: CI and development deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acs_browser_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d acs_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/acs_browser_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Static analysis and unit tests
        shell: bash
        run: |
          set +e
          npm run format:check & format_pid=$!
          npm audit --audit-level=high & audit_pid=$!
          npx turbo run check lint test & turbo_pid=$!
          npx eslint scripts playwright.config.ts & scripts_lint_pid=$!
          node --test scripts/*.test.mjs & scripts_test_pid=$!

          status=0
          for pid in "$format_pid" "$audit_pid" "$turbo_pid" "$scripts_lint_pid" "$scripts_test_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Build, backend E2E, and browser setup
        shell: bash
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          set +e
          npm run build & build_pid=$!
          npm run test:e2e & backend_e2e_pid=$!
          if [[ "$PLAYWRIGHT_CACHE_HIT" == "true" ]]; then
            npx playwright install-deps chromium & playwright_pid=$!
          else
            npx playwright install --with-deps chromium & playwright_pid=$!
          fi

          status=0
          for pid in "$build_pid" "$backend_e2e_pid" "$playwright_pid"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Browser tests
        shell: bash
        run: |
          set +e
          npm run test:e2e --workspace=acs-frontend & frontend_e2e_pid=$!
          npm run test:browser & browser_smoke_pid=$!

          status=0
          wait "$frontend_e2e_pid" || status=1
          wait "$browser_smoke_pid" || status=1
          exit "$status"

  containers:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVICE_USER_POSTGRES: acs_ci
      SERVICE_PASSWORD_64_POSTGRES: ci-only-placeholder
      SERVICE_BASE64_64_AUTH: ci-only-secret-with-at-least-32-characters
      FRONTEND_URL: https://dev.example.invalid
      PUBLIC_API_URL: https://api-dev.example.invalid
      TRUSTED_ORIGINS: https://dev.example.invalid
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: noreply@example.invalid
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Validate and build production images
        run: npm run build:containers

  deploy-development:
    name: Deploy development
    needs: [quality, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
      url: ${{ vars.DEV_URL }}
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      DEPLOY_BASE_DOMAIN: ${{ vars.DEPLOY_BASE_DOMAIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      ADMIN_USER: ${{ vars.ADMIN_USER }}
      COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
      COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Reconcile and deploy exact commit
        run: node scripts/coolify.mjs
